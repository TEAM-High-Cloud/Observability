---
mode: deployment
replicaCount: 1

image:
  repository: otel/opentelemetry-collector-k8s

dnsPolicy: ClusterFirst

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 300m
    memory: 384Mi

config:
  receivers:
    prometheus:
      config:
        scrape_configs:
          - job_name: openstack-exporter
            scrape_interval: 60s
            scrape_timeout: 30s
            static_configs:
              - targets:
                  - openstack-exporter.openstack-finops.svc.cluster.local:9180

  processors:
    batch: {}
    resource/cluster:
      attributes:
        - key: k8s.cluster.name
          value: pc1
          action: upsert
        - key: source
          value: openstack-exporter
          action: upsert

  exporters:
    otlphttp/vm:
      metrics_endpoint: >-
        http://observ-metric-server:30428/opentelemetry/api/v1/push
      encoding: proto
      timeout: 15s
      sending_queue:
        enabled: true
        queue_size: 5000
      retry_on_failure:
        enabled: true
        max_elapsed_time: 1m

  service:
    pipelines:
      metrics:
        receivers: [prometheus]
        processors: [resource/cluster, batch]
        exporters: [otlphttp/vm]

# node-scoped 메트릭은 기존 daemonset이 담당하므로 gateway에선 끈다.
presets:
  hostMetrics:
    enabled: false
  kubeletMetrics:
    enabled: false
  kubernetesAttributes:
    enabled: false
  logsCollection:
    enabled: false
