---
replicaCount: 1

image:
  repository: ghcr.io/openstack-exporter/openstack-exporter
  pullPolicy: IfNotPresent

cloud: openstack

service:
  type: ClusterIP
  port: 9180

extraArgs:
  - --disable-service.network
  - --disable-service.loadbalancer
  - --disable-service.image
  - --disable-service.identity
  - --disable-service.object-store

existingSecret:
  name: openstack-exporter-cloud-config
  key: clouds.yaml

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 256Mi

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "9180"
  prometheus.io/path: "/metrics"
