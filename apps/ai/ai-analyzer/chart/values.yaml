---
replicaCount: 1
image:
  repository: 167781471242.dkr.ecr.ap-northeast-2.amazonaws.com/obs-ai-analyzer
  tag: "db4cdb4"
  pullPolicy: IfNotPresent
service:
  type: ClusterIP
  port: 8000
resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
env:
  LOG_LEVEL: INFO
  # Cross-cluster Loki on log-server (Tailscale MagicDNS).
  # Override per environment if the NodePort differs.
  LOKI_URL: "http://observ-log-server.tail07adfd.ts.net:31100"
  # In-cluster VictoriaMetrics (same chart as vmalert datasource).
  VM_URL: "http://metric-server-victoria-metrics-single-server.victoria-metrics:8428"
  # Context window applied to both Loki and VM range queries.
  CONTEXT_WINDOW_MINUTES: "15"
  LOKI_MAX_LINES: "200"
  # Bedrock
  BEDROCK_REGION: "ap-northeast-2"
  # GLOBAL Haiku 4.5는 Marketplace subscription 미해결, APAC Sonnet 4는
  # Legacy로 마킹돼 호출 거부. 현재 활성 APAC 옵션 중 가장 강한 Sonnet 3.5 v2 사용.
  # GLOBAL Haiku 4.5 / Sonnet 4 복귀는 별 이슈.
  BEDROCK_MODEL_ID: "apac.anthropic.claude-3-5-sonnet-20241022-v2:0"
  BEDROCK_MAX_TOKENS: "1024"
  BEDROCK_TEMPERATURE: "0.2"
  # Slack channel ID (e.g. C0123456789) — find via the Slack UI or
  # conversations.list. Empty means "do not post to Slack".
  SLACK_CHANNEL: "C0B7SHREBAB"
  # Marker that the Alertmanager Slack template appends to each message so
  # ai-analyzer can match the parent message via conversations.history.
  SLACK_FINGERPRINT_MARKER: "fingerprint="
  SLACK_HISTORY_LOOKBACK: "30"
  # 분석 카드 sender override (chat:write.customize scope 필요).
  # 같은 App이 알람 + AI 분석 둘 다 발사하므로, AI 분석만 시각적으로 구분.
  SLACK_USERNAME: "AI 분석 봇"
  SLACK_ICON_URL: "https://raw.githubusercontent.com/TEAM-High-Cloud/Observability/main/apps/ai/ai-analyzer/assets/ai-analyzer-icon.png"
  SLACK_ICON_EMOJI: ":robot_face:"

# Slack Bot OAuth token (xoxb-...) — created manually as a Secret:
#   kubectl -n ai-analyzer create secret generic ai-analyzer-slack \
#     --from-literal=token=xoxb-...
# Disabled by default so the chart renders without the Secret existing.
slack:
  enabled: true
  secretName: ai-analyzer-slack
  secretKey: token
# Pod DNS — Tailscale MagicDNS needs explicit nameserver/search so the
# pod can resolve cross-cluster Tailnet hostnames (e.g. observ-log-server
# for Loki). Mirrors the pattern used by dashboard-server / openstack-nodes.
dnsPolicy: ClusterFirst
dnsConfig:
  nameservers:
    - 100.100.100.100
  searches:
    - tail07adfd.ts.net

serviceAccount:
  create: true
  name: ai-analyzer
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  fsGroup: 10001
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
# Name of the docker-registry Secret that holds the ECR pull credentials.
# Rotated by the CronJob below (see ecrTokenRefresh).
imagePullSecret:
  name: ecr-pull
# CronJob that refreshes `imagePullSecret.name` before the 12h ECR token expires.
# Required because k3s does not auto-authenticate to ECR from the node's
# instance profile the way EKS does (see issue #57).
ecrTokenRefresh:
  enabled: true
  schedule: "0 */6 * * *"
  image:
    repository: amazon/aws-cli
    tag: "2.35.5"
  awsRegion: ap-northeast-2
  ecrRegistry: 167781471242.dkr.ecr.ap-northeast-2.amazonaws.com
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
