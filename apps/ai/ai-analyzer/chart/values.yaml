---
replicaCount: 1
image:
  repository: 167781471242.dkr.ecr.ap-northeast-2.amazonaws.com/obs-ai-analyzer
  tag: "640b496"
  pullPolicy: IfNotPresent
service:
  type: ClusterIP
  port: 8000
resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
env:
  LOG_LEVEL: INFO
  # Cross-cluster Loki on log-server (Tailscale MagicDNS).
  # Override per environment if the NodePort differs.
  LOKI_URL: "http://observ-log-server:31100"
  # In-cluster VictoriaMetrics (same chart as vmalert datasource).
  VM_URL: "http://metric-server-victoria-metrics-single-server.victoria-metrics:8428"
  # Context window applied to both Loki and VM range queries.
  CONTEXT_WINDOW_MINUTES: "15"
  LOKI_MAX_LINES: "200"
  # Bedrock
  BEDROCK_REGION: "ap-northeast-2"
  BEDROCK_MODEL_ID: "anthropic.claude-haiku-4-5-20251001-v1:0"
  BEDROCK_MAX_TOKENS: "1024"
  BEDROCK_TEMPERATURE: "0.2"
serviceAccount:
  create: true
  name: ai-analyzer
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  fsGroup: 10001
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
# Name of the docker-registry Secret that holds the ECR pull credentials.
# Rotated by the CronJob below (see ecrTokenRefresh).
imagePullSecret:
  name: ecr-pull
# CronJob that refreshes `imagePullSecret.name` before the 12h ECR token expires.
# Required because k3s does not auto-authenticate to ECR from the node's
# instance profile the way EKS does (see issue #57).
ecrTokenRefresh:
  enabled: true
  schedule: "0 */6 * * *"
  image:
    repository: amazon/aws-cli
    tag: "2.35.5"
  awsRegion: ap-northeast-2
  ecrRegistry: 167781471242.dkr.ecr.ap-northeast-2.amazonaws.com
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
