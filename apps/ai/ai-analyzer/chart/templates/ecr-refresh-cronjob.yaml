{{- if .Values.ecrTokenRefresh.enabled -}}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ai-analyzer.fullname" . }}-ecr-refresh
  labels:
    {{- include "ai-analyzer.labels" . | nindent 4 }}
data:
  refresh.sh: |
    #!/bin/sh
    set -eu

    REGION="${AWS_REGION}"
    REGISTRY="${ECR_REGISTRY}"
    SECRET_NAME="${SECRET_NAME}"
    NS="${POD_NAMESPACE}"

    echo "[refresh] getting ECR token for ${REGISTRY} in ${REGION}"
    TOKEN="$(aws ecr get-login-password --region "${REGION}")"

    AUTH="$(printf 'AWS:%s' "${TOKEN}" | base64 -w0)"
    DOCKERCFG="$(printf '{"auths":{"%s":{"username":"AWS","password":"%s","auth":"%s"}}}' \
      "${REGISTRY}" "${TOKEN}" "${AUTH}" | base64 -w0)"

    KAPI="https://kubernetes.default.svc"
    SA_TOKEN="$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)"
    CACERT=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt

    BODY="$(printf '{"apiVersion":"v1","kind":"Secret","type":"kubernetes.io/dockerconfigjson","metadata":{"name":"%s","namespace":"%s"},"data":{".dockerconfigjson":"%s"}}' \
      "${SECRET_NAME}" "${NS}" "${DOCKERCFG}")"

    # Try PUT (update) first; if it 404s, POST (create).
    HTTP=$(curl -sS -o /tmp/resp -w '%{http_code}' \
      --cacert "${CACERT}" \
      -H "Authorization: Bearer ${SA_TOKEN}" \
      -H "Content-Type: application/json" \
      -X PUT \
      "${KAPI}/api/v1/namespaces/${NS}/secrets/${SECRET_NAME}" \
      -d "${BODY}")

    if [ "${HTTP}" = "404" ]; then
      echo "[refresh] secret missing, creating"
      HTTP=$(curl -sS -o /tmp/resp -w '%{http_code}' \
        --cacert "${CACERT}" \
        -H "Authorization: Bearer ${SA_TOKEN}" \
        -H "Content-Type: application/json" \
        -X POST \
        "${KAPI}/api/v1/namespaces/${NS}/secrets" \
        -d "${BODY}")
    fi

    if [ "${HTTP}" -ge 300 ]; then
      echo "[refresh] FAILED http=${HTTP}"
      cat /tmp/resp
      exit 1
    fi

    echo "[refresh] ok http=${HTTP} secret=${SECRET_NAME} ns=${NS}"
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "ai-analyzer.fullname" . }}-ecr-refresh
  labels:
    {{- include "ai-analyzer.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.ecrTokenRefresh.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 300
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 3600
      template:
        spec:
          restartPolicy: OnFailure
          serviceAccountName: {{ include "ai-analyzer.fullname" . }}-ecr-refresh
          containers:
            - name: refresh
              image: "{{ .Values.ecrTokenRefresh.image.repository }}:{{ .Values.ecrTokenRefresh.image.tag }}"
              command: ["/bin/sh", "/scripts/refresh.sh"]
              env:
                - name: AWS_REGION
                  value: {{ .Values.ecrTokenRefresh.awsRegion | quote }}
                - name: ECR_REGISTRY
                  value: {{ .Values.ecrTokenRefresh.ecrRegistry | quote }}
                - name: SECRET_NAME
                  value: {{ .Values.imagePullSecret.name | quote }}
                - name: POD_NAMESPACE
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.namespace
              volumeMounts:
                - name: script
                  mountPath: /scripts
              resources:
                {{- toYaml .Values.ecrTokenRefresh.resources | nindent 16 }}
          volumes:
            - name: script
              configMap:
                name: {{ include "ai-analyzer.fullname" . }}-ecr-refresh
                defaultMode: 0755
{{- end }}
