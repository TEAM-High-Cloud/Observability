---
replicaCount: 1

persistence:
  enabled: false

service:
  type: NodePort
  port: 9093
  nodePort: 30903

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 256Mi

extraSecretMounts:
  - name: slack-webhook
    secretName: alertmanager-slack-webhook
    mountPath: /etc/alertmanager/secrets/slack
    subPath: ""
    readOnly: true

config:
  global:
    resolve_timeout: 5m
    slack_api_url_file: /etc/alertmanager/secrets/slack/url

  route:
    receiver: slack-default
    group_by: ['alertname', 'cluster', 'severity']
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 12h
    routes:
      # ai-analyzer가 분석/요약 후 Slack 스레드에 reply.
      # continue: true 로 두어 slack-default 경로도 그대로 발사 (즉시 알림 유지).
      - receiver: ai-analyzer
        continue: true

  receivers:
    - name: slack-default
      slack_configs:
        - channel: '#alerts'
          send_resolved: true
          title: '{{ .GroupLabels.alertname }} - {{ .Status }}'
          text: |-
            {{ range .Alerts }}
            *Alert:* {{ .Annotations.summary }}
            *Severity:* `{{ .Labels.severity }}`
            *Cluster:* `{{ .Labels.cluster }}`
            *Description:* {{ .Annotations.description }}
            `fingerprint={{ .Fingerprint }}`
            {{ end }}

    # ai-analyzer는 같은 알람을 webhook으로 받아 Bedrock 분석 후
    # 같은 채널의 위 메시지에 thread reply.
    - name: ai-analyzer
      webhook_configs:
        - url: http://ai-analyzer-ai-analyzer.ai-analyzer.svc.cluster.local:8000/webhook
          send_resolved: false
          max_alerts: 64
