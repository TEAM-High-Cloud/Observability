---
replicaCount: 1

persistence:
  enabled: false

service:
  type: NodePort
  port: 9093
  nodePort: 30903

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 256Mi

extraSecretMounts:
  - name: slack-webhook
    secretName: alertmanager-slack-webhook
    mountPath: /etc/alertmanager/secrets/slack
    subPath: ""
    readOnly: true

config:
  global:
    resolve_timeout: 5m
    slack_api_url_file: /etc/alertmanager/secrets/slack/url

  route:
    receiver: slack-default
    group_by: ['alertname', 'cluster', 'severity']
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 12h

  receivers:
    - name: slack-default
      slack_configs:
        - channel: '#alerts'
          send_resolved: true
          title: '{{ .GroupLabels.alertname }} - {{ .Status }}'
          text: |-
            {{ range .Alerts }}
            *Alert:* {{ .Annotations.summary }}
            *Severity:* `{{ .Labels.severity }}`
            *Cluster:* `{{ .Labels.cluster }}`
            *Description:* {{ .Annotations.description }}
            {{ end }}
