victoria-metrics-operator:
  enabled: true
  crds:
    enabled: true

vmsingle:
  enabled: true
  spec:
    retentionPeriod: "14d"
    replicaCount: 1
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: "local-path"
          resources:
            requests:
              storage: 10Gi

grafana:
  enabled: true
  defaultDashboardsEnabled: false

nodeExporter:
  enabled: false

kubeStateMetrics:
  enabled: false

vmagent:
  enabled: false

kubeControllerManager:
  enabled: false
kubeEtcd:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false
prometheusOperator:
  enabled: false
