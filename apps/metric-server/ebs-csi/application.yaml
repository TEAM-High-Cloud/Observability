---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ebs-csi-release
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: 'https://kubernetes-sigs.github.io/aws-ebs-csi-driver'
      chart: aws-ebs-csi-driver
      targetRevision: 2.61.1
      helm:
        releaseName: aws-ebs-csi-driver
        valueFiles:
          - '$values/apps/metric-server/ebs-csi/values.yaml'
    - repoURL: 'https://github.com/TEAM-High-Cloud/Observability'
      targetRevision: HEAD
      ref: values
  destination:
    name: metric
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
