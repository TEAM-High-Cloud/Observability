---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana-dashboard-release
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: 'https://grafana.github.io/helm-charts'
      chart: grafana
      targetRevision: 8.5.2
      helm:
        releaseName: grafana
        valueFiles:
          - '$values/apps/dashboard-server/values.yaml'
        fileParameters:
          - name: dashboards.default.openstack-nodes-infra.json
            path: >-
             $values/apps/dashboard-server/dashboards/openstack-nodes-infra.json
          - name: dashboards.default.openstack-nodes-logs.json
            path: >-
             $values/apps/dashboard-server/dashboards/openstack-nodes-logs.json
    - repoURL: 'https://github.com/TEAM-High-Cloud/Observability'
      targetRevision: HEAD
      ref: values
  destination:
    name: dashboard
    namespace: grafana
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
