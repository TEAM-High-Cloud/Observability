name: GitOps Infra CI

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'apps/**'
      - '*.yaml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run yamllint
        uses: ibiqlik/action-yamllint@v3
        with:
          file_or_dir: apps/
          strict: false
