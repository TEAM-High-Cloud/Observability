name: GitOps Infra CI

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'apps/**'
      - '*.yaml'

jobs:
  lint-and-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Basic YAML Lint
        uses: ibiqlik/action-yamllint@v3
        with:
          file_or_dir: apps/
          strict: false

      - name: Setup Helm Repositories
        run: |
          helm repo add victoriametrics https://victoriametrics.github.io/helm-charts/
          helm repo add grafana https://grafana.github.io/helm-charts/
          helm repo add open-telemetry https://open-telemetry.github.io/opentelemetry-helm-charts
          helm repo update

      - name: Helm Lint Validation
        run: |
          # 메트릭 서버 검사
          if [ -f apps/metric-server/values.yaml ]; then
            helm lint victoriametrics/victoria-metrics-k8s-stack --values apps/metric-server/values.yaml
          fi

          # 대시보드 서버 검사
          if [ -f apps/dashboard-server/grafana-values.yaml ]; then
            helm lint grafana/grafana --values apps/dashboard-server/grafana-values.yaml
          fi

          # 로그 서버 검사
          if [ -f apps/log-server/loki-values.yaml ]; then
            helm lint grafana/loki --values apps/log-server/loki-values.yaml
          fi

          # PC1 OTel 검사
          if [ -f apps/openstack-nodes/pc1-controller/otel-config.yaml ]; then
            helm lint open-telemetry/opentelemetry-collector --values apps/openstack-nodes/pc1-controller/otel-config.yaml
          fi

          # PC2 OTel 검사
          if [ -f apps/openstack-nodes/pc2-controller/otel-config.yaml ]; then
            helm lint open-telemetry/opentelemetry-collector --values apps/openstack-nodes/pc2-controller/otel-config.yaml
          fi
