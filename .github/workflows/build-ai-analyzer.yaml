name: Build ai-analyzer image

on:
  push:
    branches: [main]
    paths:
      - 'apps/ai/ai-analyzer/app/**'
      - 'apps/ai/ai-analyzer/requirements.txt'
      - 'apps/ai/ai-analyzer/Dockerfile'
      - '.github/workflows/build-ai-analyzer.yaml'
  workflow_dispatch:

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: obs-ai-analyzer
  VALUES_FILE: apps/ai/ai-analyzer/chart/values.yaml

permissions:
  id-token: write
  contents: write
  pull-requests: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GHA_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tag
        id: tag
        run: echo "tag=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: apps/ai/ai-analyzer
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.tag.outputs.tag }}

      - name: Install yq
        uses: mikefarah/yq@v4.45.1

      - name: Bump image.tag in values.yaml
        run: |
          yq -i '.image.tag = "${{ steps.tag.outputs.tag }}"' "${VALUES_FILE}"

      - name: Open PR with tag bump
        uses: peter-evans/create-pull-request@v6
        with:
          branch: bot/ai-analyzer-bump-${{ steps.tag.outputs.tag }}
          base: main
          commit-message: |
            chore(ai-analyzer): bump image to ${{ steps.tag.outputs.tag }}
          title: "chore(ai-analyzer): bump image to ${{ steps.tag.outputs.tag }}"
          body: |
            Auto-generated by `Build ai-analyzer image` workflow.

            - Built and pushed: `${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.tag.outputs.tag }}`
            - This PR bumps `${{ env.VALUES_FILE }}` so ArgoCD picks up the new image.

            Merge to deploy.
          labels: |
            automation
            ai-analyzer

      - name: Summary
        run: |
          echo "Pushed: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.tag.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Auto-PR opened for values.yaml tag bump. Merge it to deploy." >> "$GITHUB_STEP_SUMMARY"
